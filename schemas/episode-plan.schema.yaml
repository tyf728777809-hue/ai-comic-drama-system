$schema: https://json-schema.org/draft/2020-12/schema
title: episode-plan
type: object
additionalProperties: false
x-workflow-guard:
  kind: episode-plan
  canonical_paths:
    - project_data/projects/*/series/episode-plan-v*.yaml
required:
  - metadata
  - series_overview
  - episodes
  - cross_episode_elements
  - risks
  - pending_items
properties:
  metadata:
    type: object
    required: [series_id, version, status, created_at, updated_at, based_on]
    properties:
      series_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  series_overview:
    type: object
    required: [total_episodes, episode_duration, target_platform, overall_arc]
    properties:
      total_episodes: {type: integer}
      episode_duration: {type: string}
      target_platform: {type: string}
      overall_arc: {type: string}
  episodes:
    type: array
    minItems: 1
    items:
      type: object
      required: [episode_id, title, goal, core_conflict, key_advances, key_characters, emotion_arc, emotion_peak, opening_hook, ending_hook, reversal, visual_highlights, production_notes, estimated_scenes, estimated_segments, risks, pending_items]
      properties:
        episode_id: {type: string}
        title: {type: string}
        goal: {type: string}
        core_conflict: {type: string}
        key_advances: {type: array}
        key_characters: {type: array}
        emotion_arc: {type: string}
        emotion_peak: {type: string}
        opening_hook: {type: string}
        ending_hook: {type: string}
        reversal: {type: string}
        visual_highlights: {type: array}
        production_notes: {type: string}
        estimated_scenes: {type: integer}
        estimated_segments: {type: integer}
        risks: {type: array}
        pending_items: {type: array}
  cross_episode_elements:
    type: object
    required: [recurring_hooks, character_arcs, escalating_tensions]
    properties:
      recurring_hooks: {type: array}
      character_arcs:
        type: array
        items:
          type: object
          required: [character, arc_summary]
          properties:
            character: {type: string}
            arc_summary: {type: string}
      escalating_tensions: {type: array}
  risks: {type: array}
  pending_items: {type: array}
