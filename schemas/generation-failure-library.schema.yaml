$schema: https://json-schema.org/draft/2020-12/schema
title: generation-failure-library
type: object
additionalProperties: false
x-workflow-guard:
  kind: generation-failure-library
  canonical_paths:
    - project_data/projects/*/episodes/*/seedance/generation-failure-library-v*.yaml
required: [metadata, failures, retry_rules, pending_items]
properties:
  metadata:
    type: object
    required: [project_id, episode_id, version, status, created_at, updated_at, based_on]
    properties:
      project_id: {type: string}
      episode_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  failures: {type: array}
  retry_rules: {type: array}
  pending_items: {type: array}
