$schema: https://json-schema.org/draft/2020-12/schema
title: creative-bible
type: object
additionalProperties: false
x-workflow-guard:
  kind: creative-bible
  canonical_paths:
    - project_data/projects/*/series/creative-bible-v*.yaml
  orchestrator_required_paths:
    - project_positioning.title
    - core_hook.logline
    - protagonist.name
    - worldbuilding.setting
    - production_params.episode_duration
required:
  - metadata
  - project_positioning
  - core_hook
  - story_core
  - protagonist
  - supporting_characters
  - character_relationships
  - worldbuilding
  - production_params
  - business_goals
  - references
  - boundaries
  - risk_assessment
  - pending_items
  - locked_vs_explorable
properties:
  metadata:
    type: object
    required: [project_name, series_id, version, status, created_at, updated_at, changelog]
    properties:
      project_name: {type: string}
      series_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      previous_version: {type: string}
      changelog: {type: array}
  project_positioning:
    type: object
    required: [title, format, genre, style, target_audience, platform]
    properties:
      title: {type: string}
      format: {type: string}
      genre: {type: string}
      style: {type: string}
      target_audience: {type: string}
      platform: {type: string}
  core_hook:
    type: object
    required: [logline, hook_description, core_selling_point, opening_hook]
    properties:
      logline: {type: string}
      hook_description: {type: string}
      core_selling_point: {type: string}
      opening_hook: {type: string}
  story_core:
    type: object
    required: [premise, core_conflict, central_question, emotional_core, narrative_arc]
    properties:
      premise: {type: string}
      core_conflict: {type: string}
      central_question: {type: string}
      emotional_core: {type: string}
      narrative_arc: {type: string}
  protagonist:
    type: object
    required: [name, appearance, signature_look, visual_keywords, core_desire, core_flaw]
    properties:
      name: {type: string}
      age: {type: string}
      occupation: {type: string}
      personality: {type: string}
      appearance: {type: string}
      visual_keywords: {type: array}
      signature_look: {type: string}
      core_desire: {type: string}
      core_flaw: {type: string}
      starting_state: {type: string}
      arc_direction: {type: string}
      special_notes: {type: string}
  supporting_characters:
    type: array
    items:
      type: object
      required: [name, appearance, signature_look, visual_keywords]
      properties:
        name: {type: string}
        role: {type: string}
        relationship_to_protagonist: {type: string}
        personality: {type: string}
        appearance: {type: string}
        visual_keywords: {type: array}
        signature_look: {type: string}
        narrative_function: {type: string}
        arc_direction: {type: string}
        special_notes: {type: string}
  character_relationships:
    type: object
  worldbuilding:
    type: object
    required: [setting, type, core_rules, visual_style, color_palette, daily_life, constraints]
    properties:
      setting: {type: string}
      type: {type: string}
      core_rules: {type: array}
      visual_style: {type: string}
      color_palette: {type: array}
      daily_life: {type: string}
      constraints: {type: array}
  production_params:
    type: object
    required: [episode_duration, episode_count, segment_duration, segments_per_episode, format_notes]
    properties:
      episode_duration: {type: string}
      episode_count: {type: string}
      segment_duration: {type: string}
      segments_per_episode: {type: string}
      format_notes: {type: string}
  business_goals:
    type: object
  references:
    type: array
  boundaries:
    type: object
  risk_assessment:
    type: object
  pending_items: {type: array}
  locked_vs_explorable:
    type: object
