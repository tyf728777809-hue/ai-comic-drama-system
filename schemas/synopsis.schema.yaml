$schema: https://json-schema.org/draft/2020-12/schema
title: synopsis
type: object
additionalProperties: false
x-workflow-guard:
  kind: synopsis
  canonical_paths:
    - project_data/projects/*/series/synopsis-v*.yaml
required:
  - metadata
  - story_overview
  - selling_points
  - platform_hooks
  - episode_targets
  - production_considerations
  - confirmed_items
  - pending_items
properties:
  metadata:
    type: object
    required: [series_id, version, status, created_at, updated_at, based_on]
    properties:
      series_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  story_overview:
    type: object
    required: [one_liner, premise, core_conflict, story_arc, ending_direction]
    properties:
      one_liner: {type: string}
      premise: {type: string}
      core_conflict: {type: string}
      story_arc: {type: string}
      ending_direction: {type: string}
  selling_points: {type: array}
  platform_hooks: {type: array}
  episode_targets:
    type: array
    minItems: 1
    items:
      type: object
      required: [episode_id, goal, hook]
      properties:
        episode_id: {type: string}
        goal: {type: string}
        hook: {type: string}
  production_considerations:
    type: object
    required: [preferred_scale, visual_focus, ai_risks]
    properties:
      preferred_scale: {type: string}
      visual_focus: {type: array}
      ai_risks: {type: array}
  confirmed_items: {type: array}
  pending_items: {type: array}
