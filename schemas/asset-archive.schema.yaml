$schema: https://json-schema.org/draft/2020-12/schema
title: asset-archive
type: object
additionalProperties: false
x-workflow-guard:
  kind: asset-archive
  canonical_paths:
    - project_data/projects/*/episodes/*/assets/asset-archive-v*.yaml
required:
  - metadata
  - summary
  - results
  - quality_summary
  - failed_assets
  - changelog
  - pending_items
  - risks
properties:
  metadata:
    type: object
    required: [series_id, episode_id, version, status, created_at, updated_at]
    properties:
      series_id: {type: string}
      episode_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
  summary: {type: object}
  results:
    type: array
    items:
      type: object
      required: [asset_id, segment_id, type, source, result_file, quality_check, status, retry_count, final_version]
      properties:
        asset_id: {type: string}
        segment_id: {type: string}
        type: {type: string}
        source: {type: string, enum: [generate, reuse]}
        reuse_from: {type: string}
        result_file: {type: string}
        quality_check: {type: string}
        status: {type: string}
        retry_count: {type: integer}
        final_version: {type: boolean}
  quality_summary: {type: object}
  failed_assets: {type: array}
  changelog: {type: array}
  pending_items: {type: array}
  risks: {type: array}
