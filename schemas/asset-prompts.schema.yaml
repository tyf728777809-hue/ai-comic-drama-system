$schema: https://json-schema.org/draft/2020-12/schema
title: asset-prompts
type: object
additionalProperties: false
x-workflow-guard:
  kind: asset-prompts
  canonical_paths:
    - project_data/projects/*/episodes/*/assets/asset-prompts-v*.yaml
required:
  - metadata
  - summary
  - prompts
  - changelog
  - pending_items
properties:
  metadata:
    type: object
    required: [series_id, episode_id, version, status, created_at, updated_at, based_on]
    properties:
      series_id: {type: string}
      episode_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  summary: {type: object}
  prompts:
    type: array
    minItems: 1
    items:
      type: object
      required: [prompt_id, asset_id, segment_id, type, subject, prompt_text, negative_prompt, continuity_hint, status, risks, notes]
      properties:
        prompt_id: {type: string}
        asset_id: {type: string}
        segment_id: {type: string}
        type: {type: string}
        subject: {type: string}
        prompt_text: {type: string}
        negative_prompt: {type: string}
        continuity_hint: {type: string}
        status: {type: string}
        risks: {type: array}
        notes: {type: string}
  changelog: {type: array}
  pending_items: {type: array}
