$schema: https://json-schema.org/draft/2020-12/schema
title: script
type: object
additionalProperties: false
x-workflow-guard:
  kind: script
  canonical_paths:
    - project_data/projects/*/episodes/*/script/script-v*.yaml
required: [metadata, episode, scenes, story_kill_pass, pending_items]
properties:
  metadata:
    type: object
    required: [project_id, episode_id, version, status, created_at, updated_at, based_on]
    properties:
      project_id: {type: string}
      episode_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  episode:
    type: object
    required: [title, goal, synopsis, core_conflict, ending_hook]
    properties:
      title: {type: string}
      goal: {type: string}
      synopsis: {type: string}
      core_conflict: {type: string}
      ending_hook: {type: string}
  scenes:
    type: array
    minItems: 1
    items:
      type: object
      required: [scene_id, location, characters, conflict, value_change, action, dialogue, subtext, production_note]
      properties:
        scene_id: {type: string}
        location: {type: string}
        characters: {type: array}
        conflict: {type: string}
        value_change: {type: string}
        action: {type: string}
        dialogue: {type: array}
        subtext: {type: string}
        production_note: {type: string}
  story_kill_pass:
    type: object
    required: [verdict, reason]
    properties:
      verdict: {type: string, enum: [pass, revise, kill]}
      reason: {type: string}
  pending_items: {type: array}
