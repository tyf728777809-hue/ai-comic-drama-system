$schema: https://json-schema.org/draft/2020-12/schema
title: script
type: object
additionalProperties: false
x-workflow-guard:
  kind: script
  canonical_paths:
    - project_data/projects/*/episodes/*/script/script-v*.yaml
  orchestrator_required_paths:
    - episode.synopsis
    - scenes[].action
    - scenes[].emotion
    - scenes[].estimated_duration
required:
  - metadata
  - episode
  - scenes
  - structure_check
  - platform_check
  - risks
  - confirmed_items
  - pending_items
properties:
  metadata:
    type: object
    required: [series_id, episode_id, version, status, created_at, updated_at, based_on]
    properties:
      series_id: {type: string}
      episode_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  episode:
    type: object
    required: [title, goal, synopsis, core_conflict]
    properties:
      title: {type: string}
      goal: {type: string}
      synopsis: {type: string}
      core_conflict: {type: string}
  characters_in_episode: {type: array}
  scenes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [scene_id, location, time, characters, action, dialogue, emotion, value_change, production_note, estimated_duration]
      properties:
        scene_id: {type: string}
        location: {type: string}
        time: {type: string}
        characters: {type: array}
        action: {type: string}
        dialogue: {type: array}
        emotion: {type: string}
        value_change: {type: string}
        production_note: {type: string}
        estimated_duration: {type: string}
  episode_hooks: {type: object}
  emotion_arc: {type: object}
  structure_check: {type: object}
  platform_check: {type: object}
  risks: {type: object}
  confirmed_items: {type: array}
  pending_items: {type: array}
