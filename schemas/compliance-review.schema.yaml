$schema: https://json-schema.org/draft/2020-12/schema
title: compliance-review
type: object
additionalProperties: false
x-workflow-guard:
  kind: compliance-review
  canonical_paths:
    - project_data/projects/*/series/reviews/compliance/compliance-report-*.yaml
    - project_data/projects/*/episodes/*/reviews/compliance/compliance-report-*.yaml
required:
  - metadata
  - conclusion
  - domain_results
  - risk_summary
  - risks
  - review_notes
  - conditions
  - rejection
  - review_log
  - changelog
properties:
  metadata:
    type: object
    required: [report_id, series_id, review_type, generated_at, target_file, target_version, target_stage, target_review_phase, target_status_before, report_version, report_status, review_round]
    properties:
      report_id: {type: string}
      series_id: {type: string}
      episode_id: {type: string}
      review_type: {type: string, enum: [compliance]}
      generated_at: {type: string}
      target_file: {type: string}
      target_version: {type: string}
      target_stage: {type: string}
      target_review_phase: {type: string}
      target_status_before: {type: string}
      report_version: {type: string}
      report_status: {type: string, enum: [draft, in_review, approved, rejected]}
      review_round: {type: integer}
      previous_report: {type: string}
  conclusion:
    type: object
    required: [verdict, risk_level, gate_decision, next_stage_allowed, reason]
    properties:
      verdict: {type: string, enum: [pass, conditional_pass, fail]}
      risk_level: {type: string}
      gate_decision: {type: string, enum: [allowed, conditional, blocked]}
      next_stage_allowed: {type: boolean}
      reason: {type: string}
  domain_results: {type: array}
  risk_summary: {type: object}
  risks: {type: array}
  review_notes: {type: object}
  conditions: {type: object}
  rejection: {type: object}
  review_log: {type: array}
  changelog: {type: array}
