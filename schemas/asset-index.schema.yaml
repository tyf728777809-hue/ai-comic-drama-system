$schema: https://json-schema.org/draft/2020-12/schema
title: asset-index
type: object
additionalProperties: false
x-workflow-guard:
  kind: asset-index
  canonical_paths:
    - project_data/projects/*/episodes/*/assets/asset-index-v*.yaml
required: [metadata, assets, shot_coverage, pending_items]
properties:
  metadata:
    type: object
    required: [project_id, episode_id, version, status, created_at, updated_at, based_on]
    properties:
      project_id: {type: string}
      episode_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  assets:
    type: array
    items:
      type: object
      required: [asset_id, asset_type, role, path, prompt_summary, reusable, status]
      properties:
        asset_id: {type: string}
        asset_type: {type: string}
        role: {type: string}
        path: {type: string}
        prompt_summary: {type: string}
        reusable: {type: boolean}
        status: {type: string}
  shot_coverage: {type: array}
  pending_items: {type: array}
