$schema: https://json-schema.org/draft/2020-12/schema
title: video-prompts
type: object
additionalProperties: false
x-workflow-guard:
  kind: video-prompts
  canonical_paths:
    - project_data/projects/*/episodes/*/videos/video-prompts-v*.yaml
required:
  - metadata
  - summary
  - prompts
  - continuity_map
  - changelog
  - pending_items
properties:
  metadata:
    type: object
    required: [series_id, episode_id, version, status, created_at, updated_at, based_on]
    properties:
      series_id: {type: string}
      episode_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  summary: {type: object}
  prompts:
    type: array
    minItems: 1
    items:
      type: object
      required: [prompt_id, task_id, segment_id, scene, characters, action, camera_movement, emotion_arc, continuity_hint, restrictions, input_strategy, status, notes]
      properties:
        prompt_id: {type: string}
        task_id: {type: string}
        segment_id: {type: string}
        scene: {type: string}
        characters: {type: string}
        action: {type: string}
        camera_movement: {type: string}
        emotion_arc: {type: string}
        continuity_hint: {type: string}
        restrictions: {type: array}
        input_strategy: {type: string}
        status: {type: string}
        notes: {type: string}
  continuity_map: {type: array}
  changelog: {type: array}
  pending_items: {type: array}
