$schema: https://json-schema.org/draft/2020-12/schema
title: asset-manifest
type: object
additionalProperties: false
x-workflow-guard:
  kind: asset-manifest
  canonical_paths:
    - project_data/projects/*/episodes/*/assets/asset-manifest-v*.yaml
required:
  - metadata
  - summary
  - assets
  - pending_items
  - changelog
properties:
  metadata:
    type: object
    required: [series_id, episode_id, version, status, created_at, updated_at, based_on]
    properties:
      series_id: {type: string}
      episode_id: {type: string}
      version: {type: string}
      status: {type: string, enum: [draft, in_review, approved, rejected]}
      created_at: {type: string}
      updated_at: {type: string}
      based_on: {type: object}
  summary: {type: object}
  assets:
    type: array
    items:
      type: object
      required: [asset_id, type, segment_id, description, purpose, source, status]
      properties:
        asset_id: {type: string}
        type: {type: string}
        segment_id: {type: string}
        description: {type: string}
        purpose: {type: string}
        source: {type: string, enum: [generate, reuse]}
        prompt: {type: string}
        prompt_ref: {type: string}
        reuse_from: {type: string}
        status: {type: string}
  pending_items: {type: array}
  changelog: {type: array}
